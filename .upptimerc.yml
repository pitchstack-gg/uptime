owner: pitchstack-gg
repo: uptime
user-agent: pitchstack-gg
skipDeleteIssues: true
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

sites:
  - name: Website
    url: https://pitchstack.gg
    maxResponseTime: 10000
  - name: Backend API
    url: https://api.pitchstack.gg/healthz
    __dangerous__body_down_if_text_missing: '"serving":true'
    maxResponseTime: 5000
  - name: Auth
    url: https://auth.pitchstack.gg/readyz
    __dangerous__body_down_if_text_missing: ok
    maxResponseTime: 5000
  - name: Sync
    url: https://api.pitchstack.gg/powersync/probes/readiness
    __dangerous__body_down_if_text_missing: '"ready":true'
    maxResponseTime: 5000

status-website:
  cname: status.pitchstack.gg
  name: Pitchstack Status
  introTitle: "**Pitchstack Status**"
  introMessage: Public uptime and incident history for Pitchstack production endpoints, monitored from outside the cluster with GitHub Actions.
  navbar:
    - title: Status
      href: /
    - title: Pitchstack
      href: https://pitchstack.gg
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
